name: Build macOS app

on:
  push:
    branches:
      - claude/multiplatform-streaming-app-dopvk5
  workflow_dispatch:

jobs:
  build:
    name: Universal .dmg
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build universal .dmg
        run: npm run app:build:universal

      # The app is intentionally unsigned: signing needs an Apple Developer
      # account and is only required to distribute to other people. Downloaded
      # artifacts are quarantined — see the CI builds section of README.md.
      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: StreamBridge-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
