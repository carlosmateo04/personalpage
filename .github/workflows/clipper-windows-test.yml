name: Clipper Windows test

# Runs the Windows installer and the clipper's tests on a real Windows machine.
# It never downloads or clips real videos: CLIPPER_SKIP_RUN stops the installer
# after setup, and the tests use footage they generate themselves.
on:
  push:
    branches:
      - 'claude/quirky-ramanujan-pk7f77'
    paths:
      - 'clipper/**'
      - '.github/workflows/clipper-windows-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CLIPPER_DIR: ${{ github.workspace }}\clipper-run
      CLIPPER_SKIP_RUN: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install with the one-line installer (Windows PowerShell 5.1)
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}  # only so that looking up the sign-in tool's latest release is not rate-limited on a shared machine
        run: Get-Content -Raw clipper\install.ps1 | Invoke-Expression

      - name: Anthropic's sign-in tool was installed and is the one the app looks for
        shell: powershell
        run: |
          $root = $env:CLIPPER_DIR
          $ant = Get-ChildItem -Path (Join-Path $root 'tools') -Recurse -Filter ant.exe | Select-Object -First 1
          if (-not $ant) { throw 'the installer did not install ant.exe (its note above says why)' }
          & $ant.FullName --version
          if ($LASTEXITCODE -ne 0) { throw 'ant.exe does not run' }
          $env:PATH = $ant.DirectoryName + ';' + $env:PATH
          Set-Location (Join-Path $root 'app')
          $found = & (Join-Path $root 'venv\Scripts\python.exe') -c "from clipper import signin; print(signin.tool())"
          Write-Host "the app finds: $found"
          if (-not $found) { throw 'the app does not recognise the installed sign-in tool' }
          # The commands the app runs exist in this version of the tool.
          & $ant.FullName auth login --help
          if ($LASTEXITCODE -ne 0) { throw 'ant has no "auth login" command' }
          $help = (& $ant.FullName auth login --help 2>&1 | Out-String)
          foreach ($flag in '--profile', '--no-browser', '--callback-port') { if ($help -notmatch [regex]::Escape($flag)) { Write-Host "::warning::ant auth login --help does not mention $flag" } }
          # The app's own sign-in code with the real tool, as far as it goes without a person:
          # the tool must start, take the options the app passes, and give the address of the page to sign in on.
          $env:ANTHROPIC_CONFIG_DIR = Join-Path $root 'ant-test'
          $code = @'
          import time
          from clipper import signin
          login = signin.Login("clipper-ci").start()
          deadline = time.time() + 40
          while not login.url and not login.done and time.time() < deadline:
              time.sleep(0.2)
          print("the tool said:", [line[:90] for line in login.lines])
          print("page to sign in on:", login.url[:70])
          login.cancel()
          raise SystemExit(0 if login.url.startswith("https://") else 1)
          '@
          $code = ($code -split "`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
          $code | & (Join-Path $root 'venv\Scripts\python.exe') -
          if ($LASTEXITCODE -ne 0) { throw 'the app got no sign-in address from the real sign-in tool' }

      - name: Run the tests
        shell: powershell
        run: |
          $root = $env:CLIPPER_DIR
          $py = Join-Path $root 'venv\Scripts\python.exe'
          $tools = Join-Path $root 'tools'
          $dirs = Get-ChildItem -Path $tools -Recurse -Include uv.exe, deno.exe, ffmpeg.exe | ForEach-Object { $_.DirectoryName } | Select-Object -Unique
          $env:PATH = ($dirs -join ';') + ';' + $env:PATH
          $env:CLIPPER_MODELS = Join-Path $root 'models'
          $env:PYTHONUTF8 = '1'
          uv pip install --python $py pytest
          if ($LASTEXITCODE -ne 0) { throw 'could not install pytest' }
          Set-Location (Join-Path $root 'app')
          & $py -m pytest -q tests
          if ($LASTEXITCODE -ne 0) { throw 'tests failed' }

      - name: Make clips from generated footage through the command line
        shell: powershell
        run: |
          $root = $env:CLIPPER_DIR
          $py = Join-Path $root 'venv\Scripts\python.exe'
          $tools = Join-Path $root 'tools'
          $dirs = Get-ChildItem -Path $tools -Recurse -Include uv.exe, deno.exe, ffmpeg.exe | ForEach-Object { $_.DirectoryName } | Select-Object -Unique
          $env:PATH = ($dirs -join ';') + ';' + $env:PATH
          $env:CLIPPER_MODELS = Join-Path $root 'models'
          $env:CLIPPER_DATA = Join-Path $root 'data'
          $inbox = Join-Path $env:CLIPPER_DATA 'inbox'
          New-Item -ItemType Directory -Force -Path $inbox | Out-Null
          $sample = Join-Path $env:CLIPPER_MODELS 'sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8\test_wavs\0.wav'
          # A 30 s test video with real speech on it, used whole like a short clip.
          ffmpeg -y -loglevel error -f lavfi -i "testsrc2=size=1280x720:rate=30:duration=30" -stream_loop 3 -i $sample -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest (Join-Path $inbox 'sample clip.mp4')
          if ($LASTEXITCODE -ne 0) { throw 'could not make the test video' }
          # Only the inbox: the real config's online sources are not used in this test.
          $config = Join-Path $root 'test-config.toml'
          Set-Content -Path $config -Encoding UTF8 -Value "[[sources]]`ntype = `"folder`"`npath = `"inbox`"`ncreator = `"Test Channel`"`npermission = `"own footage`""
          Set-Location (Join-Path $root 'app')
          & $py -m clipper --config $config run
          if ($LASTEXITCODE -ne 0) { throw 'the run failed' }
          Get-ChildItem -Recurse (Join-Path $env:CLIPPER_DATA 'out') | Select-Object FullName, Length
          Get-ChildItem -Recurse (Join-Path $env:CLIPPER_DATA 'out') -Filter *.txt | ForEach-Object { Get-Content $_.FullName -Encoding UTF8 }
          $clips = @(Get-ChildItem -Recurse (Join-Path $env:CLIPPER_DATA 'out') -Filter *.mp4)
          if ($clips.Count -lt 1) { throw 'no clip was made' }

      - name: System check of the parts that need no outside service
        shell: powershell
        run: |
          $root = $env:CLIPPER_DIR
          $py = Join-Path $root 'venv\Scripts\python.exe'
          $tools = Join-Path $root 'tools'
          $dirs = Get-ChildItem -Path $tools -Recurse -Include uv.exe, deno.exe, ffmpeg.exe | ForEach-Object { $_.DirectoryName } | Select-Object -Unique
          $env:PATH = ($dirs -join ';') + ';' + $env:PATH
          $env:CLIPPER_MODELS = Join-Path $root 'models'
          $env:CLIPPER_DATA = Join-Path $root 'data'
          Set-Location (Join-Path $root 'app')
          # Finding and downloading videos are left out: this test never touches a real video site.
          & $py -m clipper --config (Join-Path $root 'test-config.toml') check tools clip review posting
          if ($LASTEXITCODE -ne 0) { throw 'the system check found a problem' }

      - name: Daily run script and the schedule switch
        shell: powershell
        run: |
          $root = $env:CLIPPER_DIR
          $env:CLIPPER_CONFIG = Join-Path $root 'test-config.toml'
          $inbox = Join-Path $root 'data\inbox'
          $ff = (Get-ChildItem -Path (Join-Path $root 'tools') -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          # No speech this time: the first test video's words would make this one count as the same moment.
          & $ff -y -loglevel error -f lavfi -i "testsrc2=size=1280x720:rate=30:duration=20" -f lavfi -i "sine=frequency=330:duration=20" -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest (Join-Path $inbox 'second clip.mp4')
          if ($LASTEXITCODE -ne 0) { throw 'could not make the second test video' }
          # The same script the daily schedule runs: it writes a log instead of printing.
          powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'run.ps1') -Daily
          $log = Get-ChildItem (Join-Path $root 'data\logs') -Filter *.log | Select-Object -First 1
          if (-not $log) { throw 'the daily run wrote no log' }
          Get-Content $log.FullName -Encoding UTF8
          $clips = @(Get-ChildItem -Recurse (Join-Path $root 'data\out') -Filter *.mp4)
          if ($clips.Count -lt 2) { throw 'the daily run made no new clip' }
          # Switching the schedule on and off.
          powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'schedule.ps1') -At '06:30'
          $task = Get-ScheduledTask -TaskName 'Clipper daily run'
          $task.Actions | Select-Object Execute, Arguments | Format-List
          $task.Triggers | Select-Object StartBoundary | Format-List
          # The posting task: registered, runs without a window, and its command works when nothing is due.
          $poster = Get-ScheduledTask -TaskName 'Clipper posting'
          $poster.Actions | Select-Object Execute, Arguments, WorkingDirectory | Format-List
          $poster.Triggers | Select-Object -ExpandProperty Repetition | Format-List
          if ($poster.Actions[0].Execute -notlike '*pythonw.exe') { throw 'the posting task does not run without a window' }
          $run = Start-Process -FilePath $poster.Actions[0].Execute -ArgumentList $poster.Actions[0].Arguments -WorkingDirectory $poster.Actions[0].WorkingDirectory -PassThru -Wait
          if ($run.ExitCode -ne 0) { throw "the posting command failed with exit code $($run.ExitCode)" }
          powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'schedule.ps1') -Off
          if (Get-ScheduledTask -TaskName 'Clipper daily run' -ErrorAction SilentlyContinue) { throw 'the daily task was not removed' }
          if (Get-ScheduledTask -TaskName 'Clipper posting' -ErrorAction SilentlyContinue) { throw 'the posting task was not removed' }

      - name: The app starts and shows the clips; the desktop shortcut exists
        shell: powershell
        run: |
          $root = $env:CLIPPER_DIR
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Clipper.lnk'))) { throw 'the desktop shortcut was not created' }
          $env:CLIPPER_CONFIG = Join-Path $root 'test-config.toml'
          $env:CLIPPER_NO_BROWSER = '1'
          $env:CLIPPER_UI_TOKEN = 'ci-token'
          $app = Start-Process -FilePath (Join-Path $root 'Clipper.cmd') -WorkingDirectory $root -PassThru -WindowStyle Hidden
          try {
            $page = $null
            for ($i = 0; $i -lt 40 -and -not $page; $i++) {
              Start-Sleep -Seconds 1
              try { $page = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/' -UseBasicParsing } catch { }
            }
            if (-not $page -or $page.Content -notmatch 'Make clips now') { throw 'the app did not start' }
            $state = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/state' -Headers @{ 'X-Clipper-Token' = 'ci-token' }
            $state.clips | Select-Object id, state, title, seconds, media | Format-Table
            if (@($state.clips).Count -lt 2) { throw 'the app does not list the clips' }
            $clip = $state.clips | Where-Object { $_.media } | Select-Object -First 1
            # curl.exe, because Windows PowerShell's Invoke-WebRequest refuses a Range header
            $code = & curl.exe -s -o NUL -w '%{http_code}' -r 0-1023 ('http://127.0.0.1:8765' + $clip.media)
            if ($code -ne '206') { throw "the app does not serve the clip video in ranges (answered $code)" }
            $denied = $false
            try { Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/state' -Headers @{ 'X-Clipper-Token' = 'wrong' } } catch { $denied = $true }
            if (-not $denied) { throw 'the app answered without the right token' }
            $saved = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:8765/api/settings' -Headers @{ 'X-Clipper-Token' = 'ci-token' } -ContentType 'application/json' -Body '{"brand": {"handle": "@ci"}}'
            if (-not (Test-Path (Join-Path $root 'data\settings.json'))) { throw 'settings were not saved' }
          } finally {
            taskkill /PID $app.Id /T /F | Out-Null
          }

      - name: Keep the finished test clip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-clip
          path: clipper-run/data/out
          if-no-files-found: ignore
