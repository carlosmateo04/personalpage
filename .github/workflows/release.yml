name: Release

# Tagging is what publishes an update. Pushing to the branch only produces a
# test build; releases are deliberate.
#
# The manual trigger takes the tag as an input rather than inferring it, because
# a workflow_dispatch run has no tag to infer — `github.ref_name` would be the
# branch, and the release would be published under a branch name. It also covers
# the case where the tag cannot be pushed from where the work is happening.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish, e.g. v0.2.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build, sign, and publish
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-

      - name: Install dependencies
        run: |
          brew install ffmpeg
          npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test
          npm run test:rust

      # Signing is optional, and the difference is what installed copies can do
      # with the result — not whether there is a result. Without a key they can
      # still notice the release and open its .dmg (see src-tauri/src/release.rs);
      # with one they install it themselves. Refusing to publish at all would
      # make the unsigned path untestable, which is the path in use today.
      #
      # The public key is public, but it lives in a secret so the repository
      # never implies which key a given build trusts.
      - name: Decide whether this release can be signed
        id: signing
        env:
          PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -n "$PUBKEY" ]; then
            echo 'signed=true' >> "$GITHUB_OUTPUT"
            python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path('src-tauri/tauri.conf.json')
          c = json.loads(p.read_text())
          c['plugins']['updater']['pubkey'] = os.environ['PUBKEY']
          # Only a release produces an update artifact — a branch build has no
          # key to sign one with, and nothing should install an unsigned one.
          c['bundle']['createUpdaterArtifacts'] = True
          p.write_text(json.dumps(c, indent=2) + '\n')
          print('public key injected, updater artifacts enabled')
          PY
            {
              echo 'body<<RELEASE_BODY'
              echo 'Installed copies will offer this update automatically.'
              echo
              echo 'First install only: download the `.dmg`, drag to Applications, then'
              echo '`xattr -dr com.apple.quarantine /Applications/Caudal.app`.'
              echo 'RELEASE_BODY'
            } >> "$GITHUB_OUTPUT"
          else
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo "::warning::No TAURI_UPDATER_PUBKEY — publishing an unsigned release. Installed copies will notice it and offer the download, but cannot install it themselves. See UPDATES.md."
            {
              echo 'body<<RELEASE_BODY'
              echo 'Installed copies will show a banner offering this download.'
              echo 'Installing is manual: open the `.dmg`, drag to Applications, then'
              echo '`xattr -dr com.apple.quarantine /Applications/Caudal.app`.'
              echo
              echo 'This release is unsigned, so it cannot install itself. See UPDATES.md.'
              echo 'RELEASE_BODY'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target universal-apple-darwin
          # Created by the release when it does not already exist, which is
          # what makes the manual trigger equivalent to pushing the tag.
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'Caudal ${{ inputs.tag || github.ref_name }}'
          releaseBody: ${{ steps.signing.outputs.body }}
          releaseDraft: false
          prerelease: false
          # latest.json is what a signed app polls. There is nothing to put in
          # it when no updater artifact was produced, so asking for it would
          # fail the build rather than degrade.
          includeUpdaterJson: ${{ steps.signing.outputs.signed == 'true' }}
