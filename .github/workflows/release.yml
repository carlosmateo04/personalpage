name: Release

# Tagging is what publishes an update. Pushing to the branch only produces a
# test build; releases are deliberate.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, sign, and publish
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-

      - name: Install dependencies
        run: |
          brew install ffmpeg
          npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test
          npm run test:rust

      # The public key is public, but it lives in a secret so the repository
      # never implies which key a given build trusts. Without it, the build
      # still succeeds and simply cannot verify updates.
      - name: Inject the updater public key
        env:
          PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -z "$PUBKEY" ]; then
            echo "::error::TAURI_UPDATER_PUBKEY is not set. See UPDATES.md — without it the release cannot be verified by installed apps."
            exit 1
          fi
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path('src-tauri/tauri.conf.json')
          c = json.loads(p.read_text())
          c['plugins']['updater']['pubkey'] = os.environ['PUBKEY']
          p.write_text(json.dumps(c, indent=2) + '\n')
          print('public key injected')
          PY

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: 'StreamBridge ${{ github.ref_name }}'
          releaseBody: |
            Installed copies will offer this update automatically.

            First install only: download the `.dmg`, drag to Applications, then
            `xattr -dr com.apple.quarantine /Applications/StreamBridge.app`.
          releaseDraft: false
          prerelease: false
          # Publishes latest.json alongside the artifacts, which is what
          # installed apps poll.
          includeUpdaterJson: true
