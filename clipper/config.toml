# YouTube: this week's videos found by search (the "sp" part of the address is
# YouTube's "uploaded this week" filter), cut down to their best passages.
# YouTube currently refuses automated downloads from cloud machines, so these
# produce nothing here; they work when the run happens on a home connection.
[[sources]]
type = "ytdlp"
url = "https://www.youtube.com/results?search_query=gta+6+easter+eggs+secrets&sp=EgIIAw%253D%253D"
section = "findings"
min_views = 2000
min_minutes = 1
max_minutes = 25
max_items = 1

[[sources]]
type = "ytdlp"
url = "https://www.youtube.com/results?search_query=gta+6+tips+and+tricks&sp=EgIIAw%253D%253D"
section = "tricks"
min_views = 2000
min_minutes = 1
max_minutes = 25
max_items = 1

[[sources]]
type = "ytdlp"
url = "https://www.youtube.com/results?search_query=gta+6+glitches&sp=EgIIAw%253D%253D"
section = "glitches"
min_views = 2000
min_minutes = 1
max_minutes = 25
max_items = 1

# Your own recordings: drop video files into clipper/inbox/.
[[sources]]
type = "folder"
path = "inbox"
permission = "own footage"

[rights]
block_channels = ["Rockstar Games", "Take-Two Interactive"]   # never taken from
credit_format = "Credit: {creator}"                           # on the clip and in every caption

[moments]
min_len = 18                     # seconds, for passages cut from long videos
max_len = 45
max_per_source = 3
whole_clip_max = 62              # videos up to this length are used whole

[captions]
mode = "highlight"               # highlight: the spoken word pops in colour; sweep: colour fills across the line
size = 108
active_color = "#FFE600"
max_words = 3

[render]
layout = "blur"                  # blur: full picture over a blurred background; crop: fill the screen; stack: facecam above gameplay
zoom = 1.5
# facecam = [0.02, 0.65, 0.22, 0.30]   # stack layout only: x, y, width, height as shares of the frame

[campaign]
name = ""                        # fill in only if you join a paid clipping campaign
paid = false                     # true adds the on-screen disclosure, "#ad" and the platforms' paid label
required_hashtags = []
rate_per_1k = 0.0                # the campaign's pay per 1,000 views; 0 hides the earnings estimate

[schedule]
timezone = "America/New_York"
slots = ["11:30", "15:00", "19:00", "21:30"]   # one clip is posted in each slot, every day
max_days_ahead = 3               # extra good clips fill the following days

[publish]
mode = "dry_run"                 # dry_run: nothing is posted. live: clips are scheduled through Upload-Post
profile = ""                     # the Upload-Post profile your social accounts are connected to
platforms = ["tiktok", "instagram", "youtube", "facebook"]
facebook_page_id = ""
tiktok_post_mode = "DIRECT_POST" # MEDIA_UPLOAD sends clips to your TikTok drafts instead
hold_for_review = false          # true: render clips but wait for `approve` before scheduling
