# Your own recordings: drop video files into clipper/inbox/.
[[sources]]
type = "folder"
path = "inbox"
permission = "own footage"

# Gameplay only: nobody on camera, nobody talking over the game.
[filters]
no_facecam = true                # leave out footage with a streamer's webcam on it
no_commentary = true             # leave out footage where someone talks about the game over it
no_cutscenes = true              # leave out story cutscenes (the game shows them with black bars above and below)
require_speech = false           # clips may have no speech at all

# Claude, built in. It runs when Claude can be reached: with an Anthropic API key
# saved in the app (Accounts) or given as ANTHROPIC_API_KEY, or through Amazon
# Bedrock with an AWS profile on this computer. No key goes in this file.
#   scout  for each long video, Claude is shown frames from the whole video, what
#          is said and where the sound gets loud, and picks the moments to clip.
#   edit   for each clip, Claude is shown frames from it, decides whether it is
#          pure gameplay worth posting, moves the cut to where the action starts,
#          and writes the title, the headline, the search tags and on-screen notes.
# Without Claude, the loudness-based finder and rule-based titles are used.
[ai]
enabled = true
provider = "anthropic"           # anthropic (an API key), login (signed in with Claude) or bedrock (an AWS profile).
                                 # The app sets this when you choose an account under Accounts; several can be saved and switched between.
model = "claude-opus-5-5"
aws_profile = ""                 # bedrock only: e.g. "bedrock-sso"
aws_region = "us-east-1"         # bedrock only
scout = true
edit = true
scout_effort = "medium"          # low, medium, high, xhigh or max: how long it thinks about a whole video
effort = "low"                   # the same, for one clip
frames = 16                      # frames of a clip shown to the editor
max_frames = 100                 # frames of a whole video shown to the scout
margin = 15                      # seconds before and after a clip the editor may move the cut into
callouts = true                  # short on-screen notes where nothing is said
# What the channel wants, in plain words. Change it in the app (Accounts, Claude).
direction = "Chases that escalate, stunts, crashes, fights that turn, glitches, secrets and details people have not seen, and tricks that are useful. Nothing from the story."

[rights]
block_channels = ["Rockstar Games", "Take-Two Interactive"]   # never taken from
credit_format = "Credit: {creator}"                           # on the clip and in every caption

# Clip length: about a minute and a half. TikTok only pays for videos longer than
# one minute, and YouTube Shorts and Instagram Reels stop at three minutes.
[moments]
min_len = 85                     # seconds, for passages cut from long videos
max_len = 95
max_per_source = 3
whole_clip_min = 80              # a short video is used whole only if it is at least this long...
whole_clip_max = 100             # ...and at most this long

[captions]
mode = "highlight"               # highlight: the spoken word pops in colour; sweep: colour fills across the line
size = 108
active_color = "#FFE600"
max_words = 3

[render]
layout = "blur"                  # blur: full picture over a blurred background; crop: fill the screen; stack: facecam above gameplay
zoom = 1.5
# facecam = [0.02, 0.65, 0.22, 0.30]   # stack layout only: x, y, width, height as shares of the frame

[campaign]
name = ""                        # fill in only if you join a paid clipping campaign
paid = false                     # true adds the on-screen disclosure, "#ad" and the platforms' paid label
required_hashtags = []
rate_per_1k = 0.0                # the campaign's pay per 1,000 views; 0 hides the earnings estimate

[schedule]
timezone = "America/New_York"
slots = ["11:30", "15:00", "19:00", "21:30"]   # one clip is posted in each slot, every day
max_days_ahead = 3               # extra good clips fill the following days

# Posting. The accounts are connected in the app under Accounts (see ACCOUNTS.md);
# nothing about them is in this file. Each platform is reached directly through
# its own service when its account is connected, otherwise through the posting
# service (Upload-Post) when a key for that is saved.
[publish]
mode = "dry_run"                 # dry_run: a run posts nothing by itself. live: finished clips go into the outbox
platforms = ["tiktok", "instagram", "youtube", "facebook"]
hold_for_review = true           # finished clips wait in the app until you post them; false queues them by itself
youtube_privacy = "public"       # public, unlisted or private
youtube_notify = true            # tell subscribers about each upload
tiktok_direct = "draft"          # TikTok connected directly: "draft" (lands in your TikTok inbox to finish there), "private"
                                 # (only you see it) or "public" (posted with its caption; TikTok accepts it only from an app it has audited)
tiktok_privacy_level = ""        # who can watch a public post: PUBLIC_TO_EVERYONE (default), MUTUAL_FOLLOW_FRIENDS, FOLLOWER_OF_CREATOR, SELF_ONLY
tiktok_comments = true           # what a TikTok post allows; each clip can differ, in the app
tiktok_duet = true
tiktok_stitch = true
facebook_page_id = ""            # set by choosing the Page in the app
prefer_service = []              # platforms to send through the posting service even when connected directly, e.g. ["tiktok"]
profile = ""                     # the posting service's profile your accounts are connected to
tiktok_post_mode = "DIRECT_POST" # through the posting service: MEDIA_UPLOAD sends clips to your TikTok drafts instead

# The cut each platform gets, in seconds (0 = no limit). A clip is made once, at
# the length set under [moments]; where a platform's rule asks for a shorter one,
# a second version is cut around the moment the clip builds to. A clip shorter
# than a platform's min_len is not sent there. Changeable in the app under Settings.
[edits.tiktok]
min_len = 61    # TikTok's Creator Rewards Program only counts videos longer than one minute
max_len = 0

[edits.youtube]
min_len = 0
max_len = 59    # a Short over 60 seconds is blocked worldwide when a copyright owner claims something in it; 180 is YouTube's own limit

[edits.facebook]
min_len = 0
max_len = 90    # Page reels stop at 90 seconds

[edits.instagram]
min_len = 0
max_len = 180   # longer reels are not recommended to new viewers

# What the platforms ask of a video before they pay for it, beyond its length.
# These are built into every clip; each finished clip then carries a check per
# platform. The rules, where each comes from and what is done about it are in
# ACCOUNTS.md under "Rules for being paid".
[monetize]
enabled = true
calm_open = 15          # seconds at the start of every version kept free of graphic violence
                        # (YouTube: in the first 7 seconds it earns no ads, in seconds 8 to 15 limited ads)
mute_profanity = true   # strong language is silenced in the sound, as it is masked in the captions
music = "note"          # a clip with music playing: "note" posts it and says so; "hold" keeps it for you
music_share = 0.5       # with "hold": the share of the clip with music from which it is held
min_height = 720        # a source picture lower than this is reported as blurry
strict = true           # a platform whose rule a clip breaks is not sent that clip
