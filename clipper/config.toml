# Your own recordings: drop video files into clipper/inbox/.
[[sources]]
type = "folder"
path = "inbox"
permission = "own footage"

# Gameplay only: nobody on camera, nobody talking over the game.
[filters]
no_facecam = true                # leave out footage with a streamer's webcam on it
no_commentary = true             # leave out footage where someone talks about the game over it
require_speech = false           # clips may have no speech at all

# The automatic review. It only runs when a Claude API key is saved in the app
# (Accounts) or given as ANTHROPIC_API_KEY; the key itself never goes in this file.
# For each planned clip, Claude sees frames from it and its transcript, drops it if
# it is not pure gameplay, picks the section and writes the title and headline.
[review]
enabled = true
model = "claude-opus-5-5"
effort = "low"                   # low, medium or high: how long it thinks about each clip
frames = 8                       # frames shown per clip

[rights]
block_channels = ["Rockstar Games", "Take-Two Interactive"]   # never taken from
credit_format = "Credit: {creator}"                           # on the clip and in every caption

# Clip length: about a minute and a half. TikTok only pays for videos longer than
# one minute, and YouTube Shorts and Instagram Reels stop at three minutes.
[moments]
min_len = 85                     # seconds, for passages cut from long videos
max_len = 95
max_per_source = 3
whole_clip_min = 80              # a short video is used whole only if it is at least this long...
whole_clip_max = 100             # ...and at most this long

[captions]
mode = "highlight"               # highlight: the spoken word pops in colour; sweep: colour fills across the line
size = 108
active_color = "#FFE600"
max_words = 3

[render]
layout = "blur"                  # blur: full picture over a blurred background; crop: fill the screen; stack: facecam above gameplay
zoom = 1.5
# facecam = [0.02, 0.65, 0.22, 0.30]   # stack layout only: x, y, width, height as shares of the frame

[campaign]
name = ""                        # fill in only if you join a paid clipping campaign
paid = false                     # true adds the on-screen disclosure, "#ad" and the platforms' paid label
required_hashtags = []
rate_per_1k = 0.0                # the campaign's pay per 1,000 views; 0 hides the earnings estimate

[schedule]
timezone = "America/New_York"
slots = ["11:30", "15:00", "19:00", "21:30"]   # one clip is posted in each slot, every day
max_days_ahead = 3               # extra good clips fill the following days

[publish]
mode = "dry_run"                 # dry_run: nothing is posted. live: clips are scheduled through Upload-Post
profile = ""                     # the Upload-Post profile your social accounts are connected to
platforms = ["tiktok", "instagram", "youtube", "facebook"]
facebook_page_id = ""
tiktok_post_mode = "DIRECT_POST" # MEDIA_UPLOAD sends clips to your TikTok drafts instead
hold_for_review = true           # finished clips wait in the app until you post them; false posts them by itself
