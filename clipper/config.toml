# Clipper settings. Anything left out keeps its default (see clipper/config.py).
# No secrets belong in this file.
#
# The model these settings implement:
#   1. GTA 6 videos and clips are found online (Twitch channels, YouTube searches).
#   2. The highlights are cut out and sorted into sections: new findings, tricks,
#      glitches and wild moments.
#   3. Each becomes a short vertical clip with karaoke captions, a section badge
#      and a credit to the channel it came from. The sound is the footage's own.
#   4. Clips are posted to TikTok, Instagram, YouTube and Facebook four times a day,
#      taking the sections in turn.

[brand]
name = "GTA 6 Clips"
game = "GTA 6"
handle = ""                      # your own handle, shown next to the credit, e.g. "@yourchannel"

# ---------------------------------------------------------------------------
# Sections. A clip goes to the section whose cue words appear in its title and
# in what is said; with no clear signal it goes to "moments".
# ---------------------------------------------------------------------------
[[sections]]
name = "findings"
label = "NEW FINDING"
color = "#FFE600"
cues = ["easter egg", "secret", "hidden", "i found", "we found", "found a", "discovered", "did you know", "detail",
        "nobody noticed", "reference", "never seen", "mystery", "bigfoot", "ufo", "alien", "ghost"]
hashtags = ["#gta6secrets", "#gta6eastereggs"]
youtube_playlist_id = ""         # optional: a playlist on your channel for this section

[[sections]]
name = "tricks"
label = "TRICK"
color = "#00E0FF"
cues = ["how to", "trick", "tip", "pro tip", "fastest way", "easy way", "easiest way", "unlock", "cheat", "shortcut",
        "all you have to do", "you just need", "money fast", "best way"]
hashtags = ["#gta6tips", "#gta6tricks"]
youtube_playlist_id = ""

[[sections]]
name = "glitches"
label = "GLITCH"
color = "#7CFF4F"
cues = ["glitch", "glitched", "bug", "bugged", "broken", "clipped through", "fell through", "under the map",
        "out of bounds", "launched", "physics"]
hashtags = ["#gta6glitch", "#gta6bugs"]
youtube_playlist_id = ""

[[sections]]
name = "moments"                 # the catch-all
label = "WILD MOMENT"
color = "#FF2E93"
cues = []
hashtags = ["#gta6funny", "#gta6moments"]
youtube_playlist_id = ""

# ---------------------------------------------------------------------------
# Where footage comes from. One [[sources]] block per source.
#   permission  on what basis the footage is used (the creator's clip policy, a
#               campaign you joined, your own footage). Empty means none on file;
#               the daily report lists these.
#   section     where its clips go unless their content clearly says otherwise.
# ---------------------------------------------------------------------------

# Twitch: each channel's most-viewed clips of the last 24 hours, GTA 6 only.
# These are already highlights picked by viewers, so they are used whole.
