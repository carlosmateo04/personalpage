[package]
name = "streambridge"
version = "0.1.0"
description = "Multi-platform live streaming from one machine"
edition = "2021"
rust-version = "1.77"

[lib]
# `staticlib`/`cdylib` keep the door open for mobile targets later; `rlib` is
# what the thin `main.rs` binary links against on desktop.
name = "streambridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
