[package]
name = "streambridge"
version = "0.1.0"
description = "Multi-platform live streaming from one machine"
edition = "2021"
rust-version = "1.77"

[lib]
# `staticlib`/`cdylib` keep the door open for mobile targets later; `rlib` is
# what the thin `main.rs` binary links against on desktop.
name = "streambridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# Signalling ffmpeg directly. A stop that cannot escalate past a polite
# request is not a stop.
libc = "0.2"

# Stream keys go to the macOS login Keychain. Scoped to macOS so the crate's
# platform backends are not dragged in anywhere they cannot build.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
